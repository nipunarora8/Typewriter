name: Release

# Push a tag such as v0.1.1 to build the downloads and the signed update files.
# The tag must match "version" in src-tauri/tauri.conf.json.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tag must match the app version
        run: |
          V=$(python3 -c "import json;print(json.load(open('src-tauri/tauri.conf.json'))['version'])")
          [ "v$V" = "$GITHUB_REF_NAME" ] || { echo "Tag $GITHUB_REF_NAME does not match version $V in tauri.conf.json"; exit 1; }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: rustup show
      - run: npm ci
      - name: Build, sign and upload the Mac app and update files
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Typewriter ${{ github.ref_name }}
          releaseDraft: false
          args: --bundles app
      - name: Make and upload the disk image
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          scripts/make-dmg.sh
          gh release upload "$GITHUB_REF_NAME" src-tauri/target/release/bundle/dmg/*.dmg --clobber

  linux:
    # Built on the oldest supported Ubuntu so the AppImage runs on many distros.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Tag must match the app version
        run: |
          V=$(python3 -c "import json;print(json.load(open('src-tauri/tauri.conf.json'))['version'])")
          [ "v$V" = "$GITHUB_REF_NAME" ] || { echo "Tag $GITHUB_REF_NAME does not match version $V in tauri.conf.json"; exit 1; }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev
      - run: rustup show
      - run: npm ci
      - name: Build, sign and upload the AppImage and update files
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Typewriter ${{ github.ref_name }}
          releaseDraft: false
          args: --bundles appimage
